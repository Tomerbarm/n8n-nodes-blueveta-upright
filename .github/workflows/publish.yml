# Publishes this package to npm with provenance on every GitHub Release —
# n8n's own community-node verification guidelines (docs.n8n.io, checked
# 2026-11-03) require packages published this way (public GitHub repo +
# npm provenance), not a plain manual `npm publish` from a developer machine.
#
# Trusted Publisher (npm OIDC) linked to this repo + this workflow file
# 2026-11-08 -- no NPM_TOKEN secret needed, npm verifies the GitHub Actions
# OIDC token directly.
#
# REAL BUG FOUND AND FIXED 2026-11-08 (run #1, v0.1.1): a plain `npm ci`
# fails on GitHub's ubuntu-latest runner -- `n8n-workflow` is a
# peerDependency, and npm auto-installs peer deps during `ci`, which pulls
# in `isolated-vm` (one of n8n-workflow's own dependencies, used for its
# expression-sandbox). isolated-vm needs native C++ compilation (node-gyp),
# and its prebuilt bindings don't match the runner's current GCC/V8
# combination -- confirmed via the real build log (`SourceLocation` type
# errors, `override`/`final` mismatches in V8 headers). This package never
# actually executes n8n-workflow's runtime code (it's only imported for
# TypeScript types + one re-exported constant that n8n supplies at runtime
# when it loads this node) -- confirmed by checking every real import in
# nodes/ and credentials/. `--ignore-scripts` skips the native build
# entirely (safe here, since nothing in this package's own build/test ever
# needs isolated-vm's compiled binary) without skipping the actual package
# install itself.
#
# REAL BUG FOUND AND FIXED 2026-11-08 (run #2, v0.1.2): npm publish got all
# the way through building the tarball and SIGNING provenance successfully
# (real transparency-log entry created, confirmed in the run's own log),
# then failed with a misleading `404 ... is not in this registry` on the
# actual registry PUT. Root cause: Node 20's bundled npm (~10.x) can sign
# provenance but is too old to complete the newer OIDC token-exchange flow
# Trusted Publishing needs -- npm's own docs/community reports say 11.5.1+
# is required, and the 404 is npm's real (if confusing) error for that auth
# failure, not an actual missing-package error. Fixed by explicitly
# upgrading npm after setup-node, rather than relying on whatever a given
# Node version happens to bundle.
#
# REAL BUG FOUND AND FIXED 2026-11-08 (run #3, v0.1.3): `npm install -g
# npm@latest` itself failed -- latest npm is now 12.2.2, which requires
# Node ^22.22.0 || ^24.15.0 || >=26.0.0 (confirmed in the real EBADENGINE
# error), but this workflow was still on Node 20. Rather than pin to a
# specific npm major version (which just moves the same problem to the
# future), bumped node-version to 22 (current LTS) -- its own bundled npm
# already clears the 11.5.1 OIDC-exchange requirement, and npm@latest's
# own engine requirement is satisfied too.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for npm provenance / OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
